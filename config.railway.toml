# OpenFang Agent OS — Railway deployment config
# Variables are substituted at runtime via envsubst

api_listen = "0.0.0.0:${PORT}"
api_key = "${OPENFANG_API_KEY}"
log_level = "info"
home_dir = "/data"
data_dir = "/data"

# ── LLM Provider ──
[default_model]
provider = "gemini"
model = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"

[[fallback_providers]]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
api_key_env = "ANTHROPIC_API_KEY"

[[fallback_providers]]
provider = "groq"
model = "llama-3.3-70b-versatile"
api_key_env = "GROQ_API_KEY"

# ── Matrix: connect to Synapse via Railway internal network ──
[channels.matrix]
homeserver_url = "${MATRIX_HOMESERVER_URL}"
user_id = "@openfang:${SYNAPSE_SERVER_NAME}"
access_token_env = "MATRIX_ACCESS_TOKEN"
auto_accept_invites = true
allowed_rooms = []
group_policy = "mention_only"

# ── Per-room extra mention keywords ──
# When any keyword below appears in a message's plain body (case-insensitive)
# the bot treats it like a mention — even if no Matrix m.mentions is present.
# Useful for WhatsApp UX: mautrix-whatsapp forwards group @mentions as raw
# text (e.g. the group's JID) without producing a Matrix mention event, so
# the bot would otherwise never activate on @CTL / @centinela / etc.
#
# To add/change keywords without rebuilding, drop equivalent blocks into
# /data/config.local.toml on the Railway volume and restart the service.

# Data Devs (https://chat.whatsapp.com/HSxtgYnq0XlLJP1qhyXV9P)
# "@CTL" from WhatsApp resolves to the CTL group JID, forwarded as plain text.
[[channels.matrix.room_triggers]]
room_id = "!HdemcauqipyZqYhGqw:matrix.centinela.io"
keywords = ["@ctl", "@120363425422565445@g.us"]

# ── Agent routing ──
# Default binding — all unmatched Matrix messages go to assistant.
# Per-room bindings are loaded from /data/bindings.toml on the volume.
# Edit bindings.toml and restart (or call POST /api/channels/reload)
# to change routing WITHOUT rebuilding the Docker image.

[[bindings]]
agent = "General Assistant"
[bindings.match_rule]
channel = "matrix"

# ── Web search (optional) ──
[web]
search_provider = "auto"
